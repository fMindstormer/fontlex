name: Checks
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-24.04      # Playwright 1.54 has no Chromium for Ubuntu 26.04 (ubuntu-latest since November 2026)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - name: Install
        run: |
          pip install -r requirements.txt
          npm install --no-save playwright-core@1.54.2 puppeteer-core@25.15.0 @puppeteer/browsers@3.2.5
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM=$(node -e 'console.log(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"
          echo "FIREFOX=$(npx @puppeteer/browsers install firefox@stable_158.0.1 --path "$RUNNER_TEMP/browsers" --format "{{path}}")" >> "$GITHUB_ENV"
      - name: Build every font and page, and run every check HarfBuzz and Chromium can do
        run: ./check.sh
      - name: The rebuild matches the repository byte for byte
        # WOFF2 by what it holds: Brotli can compress the same font a few bytes
        # differently on another machine (Fontlex Math's did, by 280 bytes)
        run: |
          for f in $(git diff --name-only -- '*.woff2'); do
            git show "HEAD:$f" > "$RUNNER_TEMP/committed.woff2"
            python -c 'import sys; from fontTools.ttLib import TTFont; from io import BytesIO
          def ttf(p):
              f = TTFont(p, recalcTimestamp=False); f.flavor = None; b = BytesIO(); f.save(b); return b.getvalue()
          sys.exit(ttf(sys.argv[1]) != ttf(sys.argv[2]))' "$RUNNER_TEMP/committed.woff2" "$f" \
              && echo "$f: compressed differently, the same font" && git checkout -- "$f"
          done
          git status --short && git diff --stat --exit-code
