name: DirectWrite
# Every font shaped by DirectWrite, the shaper of Windows' own text APIs
# (engines/dwshape.cpp), and checked as check.sh checks them in HarfBuzz.
on:
  push:
    paths: [build/*.ttf, engines/**, test_fontlex.py, math/**, markdown/**, english/**, french/**,
            specs/**, .github/workflows/directwrite.yml]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  directwrite:
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    env: { PYTHONUTF8: "1" }        # files and output in UTF-8, not the Windows code page
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - name: Install
        run: pip install -r requirements.txt
      - name: Build the DirectWrite helper
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cl /nologo /std:c++20 /O2 /EHsc /utf-8 /W4 engines\dwshape.cpp dwrite.lib /Fo:build\ /Fe:build\dwshape.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          (Get-Item C:\Windows\System32\DWrite.dll).VersionInfo.ProductVersion
      - name: A few lines, side by side with HarfBuzz
        run: |
          python engines/compare.py build/Fontlex-Python.ttf directwrite "def f(x): return 1"
          python engines/compare.py build/Fontlex-English.ttf directwrite "the nation"
          python engines/compare.py build/Fontlex-Math.ttf directwrite "x^2" "\\frac{a}{b}"
      - name: Probes, one mechanism each
        run: python engines/probes.py directwrite
      - name: The first lookup where DirectWrite parts from HarfBuzz
        run: |
          python engines/first_difference.py build/Fontlex-Math.ttf directwrite "x^2"
          python engines/first_difference.py build/Fontlex-Math.ttf directwrite "\\frac{a}{b}"
          python engines/first_difference.py build/Fontlex-RelaxedMath.ttf directwrite "(a+b)/(c+d)"
          python engines/first_difference.py build/Fontlex-Markdown.ttf directwrite "**bold** and *it*"
      - name: Every font, in DirectWrite
        timeout-minutes: 30
        run: PYTHON=python N=300 engines/check_directwrite.sh
