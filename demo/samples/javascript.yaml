file: example.js
oneliner: 'if (total > 10) return "big"; // done'
sample: |
  // This box has no highlighter attached.
  /* Every color comes from the font's own substitution rules. */
  import { readFile } from "fs/promises";

  const LIMIT = 100, ratio = 3 / 4, name = /^[a-z_$][\w$]*$/i;

  export async function load(path, limit = LIMIT) {
    const text = await readFile(path, "utf-8");
    const data = JSON.parse(text);
    if (!Array.isArray(data)) {
      throw new Error(`expected a list in ${path}`);
    }
    return data.slice(0, limit).map((d) => ({ x: d.x * 2.5e3, y: d.y ?? null }));
  }

  for (const [i, p] of (await load('points.json')).entries()) {
    if (p.x === undefined || p.y < 0) continue; // skip "bad" rows
    console.log(i, typeof p.x, 'it\'s fine', 0xFF);
  }
